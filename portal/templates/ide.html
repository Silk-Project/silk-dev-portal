<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silk Developer Portal - Web IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='silkoslogo.png') }}">
    <style>
        html {
            scroll-behavior: smooth;
            height: 100%;
        }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #09040C;
            color: #F2E9F7;
            margin: 0;
            padding: 0;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .bg-primary-dark { background-color: #09040C; }
        .bg-primary-medium { background-color: rgba(9, 4, 12, 0.9); }
        .bg-footer-dark { background-color: rgba(6, 2, 8, 0.9); }
        .text-primary-accent { color: #B153DD; }
        .hover-bg-accent:hover { background-color: #7720A2; }
        
        /* Utility */
        .hidden {
            display: none;
        }
        .container {
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        /* Header */
        header {
            background-color: rgba(9, 4, 12, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1f2937;
            flex-shrink: 0;
            z-index: 50;
            transition: transform 0.3s ease;
        }

        #header-toggle {
            position: fixed;
            top: 5px;
            left: 5px;
            z-index: 100;
            display: none;
        }
        
        #header-toggle.show {
            display: block;
        }

        #header-toggle-btn {
            width: 25px;
            height: 25px;
            font-size: 10px;
            border-radius: 0.375rem;
            color: #d1d5db;
            cursor: pointer;
            transition: 0.2s;
            border: solid 1px rgba(165, 165, 165, 0.3);
        }

        #header-toggle-at-header {
            display: none;
            width: 40px;
            height: 40px;
            color: #9ca3af;
            border: none;
            background-color: transparent;
            transition: 0.2s;
        }

        #header-toggle-at-header:hover {
            color: #fff;
            cursor: pointer;
        }
        
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 4rem;
        }
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #F2E9F7;
        }
        .logo-link img {
            height: 2rem;
            width: 2rem;
            margin-right: 0.75rem;
        }
        .logo-link span {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .account-btn {
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
            color: #9ca3af;
            user-select: none;
            transition: 0.2s;
            cursor: pointer;
            border: none;
            background-color: transparent;
        }
        .account-btn:hover {
            color: #fff;
        }
        .account-btn p {
            font-size: 14px;
        }
        #account-option-container {
            position: absolute;
            margin-top: 6px;
            transform: translateX(-15px);
            background-color: rgba(9, 4, 12, 0.9);
            border: solid 1px #1f2937;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(12px);
        }
        #account-option-container.hidden {
            display: none;
        }
        #account-option-container button {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            color: #d1d5db;
            font-size: 16px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s, background-color 0.2s;
        }
        #account-option-container button:hover {
            background-color: #374151;
            color: #fff;
        }
        .vl {
            border-left: 1px solid rgba(77, 77, 77, 0.425);
            height: 35px;
        }
        
        /* Portal */
        #site-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            width: 100%;
        }

        /* IDE Content */
        main {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            background-image: url(../static/bg.png);
            background-position: center;
            background-repeat: no-repeat;
            background-color: #5c0086;
            background-size: cover;
        }

        #ide-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: none;
            background: #1e1e1e;
        }

        #ide-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        #launch-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            border: solid 1px#a5a5a550;
            background-color: #0c01137a;
            z-index: 10;
            padding: 40px 70px;
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            box-shadow: 2px 2px 10px #ffffff13;
            gap: 10px;
            backdrop-filter: blur(4px);
            margin: auto;
        }

        #titlebox {
            display: flex;
            flex-direction: column;
            padding: 20px 0 20px 0;
            gap: 10px;
            margin: 0;
            text-align: center;
        }

        #titlebox h1, p {
            text-align: center;
            margin: 5px 0 5px 0;
        }

        .loader {
            display: none;
            margin: 5px 0 5px 0;
            font-size: 24px;
        }
        
        #error-msg {
            color: #ef4444;
            margin-top: 15px;
            display: none;
        }

        #site-content button {
            padding: 8px 15px;
            border-radius: 8px;
            border: solid 1px #a5a5a550;
            color: white;
            font-size: 18px;
        }

        #credentials {
            margin: 10px 0 20px 0;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: left;
            font-family: monospace;
            font-size: 0.9em;
        }

        /* Desktop Navigation */
        .desktop-nav {
            display: none;
            column-gap: 0.25rem;
        }
        .nav-link {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            color: #d1d5db;
            text-decoration: none;
            transition: color 0.2s, background-color 0.2s;
        }
        .nav-link:hover {
            background-color: #374151;
            color: #fff;
        }
        #admin-links {
            display: none;
        }

        /* Desktop Socials */
        .desktop-socials {
            display: none;
            align-items: center;
            column-gap: 1rem;
        }
        .social-link {
            color: #9ca3af;
            transition: color 0.2s;
        }
        .social-link:hover {
            color: #fff;
        }
        .social-link i {
            font-size: 1.25rem;
        }

        /* Mobile Menu */
        .mobile-menu-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            width: 100px;
            align-items: center;
            gap: 15px;
        }
        .mobile-menu-btn {
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .mobile-menu-btn:focus {
            outline: none;
        }

        #mobile-menu {
            background-color: #111827;
        }
        #mobile-menu nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            row-gap: 0.5rem;
        }
        #mobile-menu .nav-link {
            display: block;
            width: 100%;
            text-align: center;
        }
        #mobile-menu .mobile-socials {
            display: flex;
            align-items: center;
            column-gap: 1.5rem;
            padding-top: 1rem;
        }
        #mobile-menu .social-link i {
            font-size: 1.5rem;
        }

        /* Responsive (md) */
        @media (min-width: 900px) {
            .desktop-nav {
                display: flex;
            }
            .desktop-socials {
                display: flex;
            }
            .mobile-menu-wrapper {
                display: none;
            }
            #mobile-menu {
                display: none !important;
            }
        }

        @media (max-width: 1300px) {
            #container_forum {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
            }
            #server_infos {
                justify-content: center;
                width: 100%;
                gap: 20px;
            }
        }

        /* Buttons */
        .btn {
            color: #fff;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: inline-flex;
            align-items: center;
            column-gap: 0.5rem;
            border: solid 1px rgba(165, 165, 165, 0.3);
            cursor: pointer;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-secondary {
            background-color: #1f2937;
        }
        .btn-secondary:hover {
            background-color: #374151;
        }
        .btn-primary {
            background-color: #B153DD;
        }
        .btn-primary:hover {
            background-color: #7720A2;
        }

        /* Footer */
        footer {
            background-color: rgba(6, 2, 8, 0.9);
            text-align: center;
            padding: 0.8rem 0;
        }
        footer p {
            color: #9ca3af;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- Header Toggle -->
    <div id="header-toggle">
        <button id="header-toggle-btn" class="btn-secondary" onclick="toggleHeader()">
            <i class="fa-solid fa-angle-down"></i>
        </button>
    </div>

    <header id="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo-link">
                    <img src="{{ url_for('static', filename='silkoslogo.svg') }}" alt="SilkOS Logo">
                    <span>Silk Project [DEV]</span>
                </a>

                <nav class="desktop-nav">
                    <a href="index.html" class="nav-link">Main</a>
                    <a href="manage.html" class="nav-link">Manage</a>
                    <a href="ide.html" class="nav-link">IDE</a>
                    <div id="admin-links">
                        <a href="admin-panel.html" class="nav-link">Admin Panel</a>
                    </div>
                    <a href="about.html" class="nav-link">About</a>
                </nav>
                
                <div class="desktop-socials">
                    <div class="account-container">
                        <div class="account-btn" onclick="toggleAccountBtn()">
                            <i class="fa fa-user"></i>
                            <p class="account-name">Login</p>
                        </div>
                        <div id="account-option-container" class="hidden">
                            <button onclick="logOut()">Sign Out</button>
                        </div>
                    </div>
                    <div class="vl"></div>
                    <a href="feed.xml" class="social-link"><i class="fa fa-rss-square"></i></a>
                    <a href="mailto:silkprojectdev@gmail.com" class="social-link"><i class="fa fa-envelope"></i></a>
                    <a href="https://github.com/Silk-Project" class="social-link"><i class="fab fa-github"></i></a>
                    <button id="header-toggle-at-header" onclick="toggleHeader()">
                        <i class="fa-solid fa-angle-up"></i>
                    </button>
                </div>

                <div class="mobile-menu-wrapper">
                    <div class="account-container">
                        <div class="account-btn" onclick="toggleAccountBtn()">
                            <i class="fa fa-user"></i>
                            <p class="account-name">Login</p>
                        </div>
                        <div id="account-option-container" class="hidden">
                            <button onclick="logOut()">Sign Out</button>
                        </div>
                    </div>
                    <div class="vl"></div>
                    <button id="mobile-menu-button" class="mobile-menu-btn">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <div id="mobile-menu" class="hidden">
            <nav>
                <a href="index.html" class="nav-link">Main</a>
                <a href="manage.html" class="nav-link">Manage</a>
                <a href="ide.html" class="nav-link">IDE</a>
                <div id="admin-links">
                    <a href="admin-panel.html" class="nav-link">Admin Panel</a>
                </div>
                <a href="about.html" class="nav-link">About</a>
                <div class="mobile-socials">
                    <a href="feed.xml" class="social-link"><i class="fa fa-rss-square"></i></a>
                    <a href="mailto:silkprojectdev@gmail.com" class="social-link"><i class="fa fa-envelope"></i></a>
                    <a href="https://github.com/Silk-Project" class="social-link"><i class="fab fa-github"></i></a>
                </div>
                <button class="btn btn-secondary" onclick="toggleHeader()" style="margin-top: 1rem;">
                    <i class="fa-solid fa-angle-up"></i>
                </button>
            </nav>
        </div>
    </header>

    <div id="site-content">
        <main>
            <div id="launch-screen">
                <div id="titlebox">
                    <h1>Silk Cloud IDE [BETA]</h1>
                    <p>Launch your personal development environment powered by Code-Server.</p>
                </div>
            
                <div id="credentials">
                    <strong>Password:</strong> <span id="ide-password">...</span>
                </div>

                <div class="loader">
                    <i class="fa-solid fa-cog fa-spin"></i>
                </div>

                <p id="error-msg"></p>

                <div>
                    <button id="launch-btn" class="btn-primary" onclick="launchIDE()">
                        <i class="fa fa-rocket"></i> Launch Environment
                    </button>
                </div>

            </div>

            <div id="ide-container">
                <iframe id="ide-frame" src=""></iframe>
            </div>
        </main>

        <footer id="footer" class="bg-footer-dark">
            <p>&copy; 2025 The Silk Project.</p>
        </footer>
    </div>
    

    <script>
        const token = localStorage.getItem("silk-token");
        const launchBtn = document.getElementById('launch-btn');
        const loader = document.querySelector('.loader');
        const errorMsg = document.getElementById('error-msg');
        const ideContainer = document.getElementById('ide-container');
        const launchScreen = document.getElementById('launch-screen');
        const credentialsBox = document.getElementById('credentials');
        const passwordSpan = document.getElementById('ide-password');
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const footer = document.getElementById('footer');
        const container = document.getElementById("account-option-container");
        const admin_links = document.getElementById("admin-links");
        const header = document.getElementById("header");
        const headerToggleFixed = document.getElementById("header-toggle");
        const headerToggleAtHeader = document.getElementById("header-toggle-at-header");
        let accountNameElements = document.getElementsByClassName("account-name");
        let logged_in = false;
        let headerHidden = false;
        let tempHeaderVisible = false;
        
        let ide_url = "";

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        async function validate() {
            try {
                const response = await fetch("/api/validate/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token })
                });
                const data = await response.json();
                if (data.status === "Success") {
                    logged_in = true;
                    for(let el of accountNameElements) el.innerText = data.username;

                    // Show admin links if user is admin
                    if (data.username === "admin") {
                        admin_links.style.display = "flex";
                    }
                } else {
                    window.location.href = "login.html";
                }
            } catch (err) {
                window.location.href = "login.html";
            }
        }

        async function launchIDE() {
            launchBtn.disabled = true;
            launchBtn.style.display = 'none';
            loader.style.display = 'block';
            errorMsg.style.display = 'none';
            
            try {
                const response = await fetch("/api/ide/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token })
                });
                
                const data = await response.json();
                
                if (data.status === "Success") {
                    passwordSpan.innerText = data.password;
                    credentialsBox.style.display = 'block';
                    ide_url = data.url;
                    
                    launchBtn.innerText = "Open IDE Now";
                    launchBtn.style.display = 'inline-flex';
                    launchBtn.disabled = false;
                    launchBtn.onclick = openIDE;
                    
                } else {
                    throw new Error(data.message || "Failed to start IDE");
                }
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.style.display = 'block';
                launchBtn.disabled = false;
            } finally {
                loader.style.display = 'none';
            }
        }
        
        function openIDE() {
            launchScreen.style.display = 'none';
            footer.style.display = 'none';
            ideContainer.style.display = 'block';
            headerToggleAtHeader.style.display = 'block';

            document.getElementById('ide-frame').src = ide_url;
        }

        function logOut () {
            localStorage.removeItem("silk-token");
            localStorage.removeItem("user");
            window.location.href = "index.html";
        }

        function toggleAccountBtn () {
            if (logged_in) {
                container.classList.toggle("hidden");
            } else {
                window.location.href = "login.html";
            }
        }

        function toggleHeader() {
            headerHidden = !headerHidden;
            
            if (headerHidden) {
                header.style.display = "none";
                headerToggleFixed.classList.add("show");
                headerHoverArea.classList.add("show");
            } else {
                header.style.display = "block";
                headerToggleFixed.classList.remove("show");
                headerHoverArea.classList.remove("show");
            }
        }

        if(!token) window.location.href = "login.html";
        else validate();

    </script>
</body>
</html>
