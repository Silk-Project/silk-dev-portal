<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silk Developer Portal - Web IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='silkoslogo.png') }}">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #09040C;
            color: #F2E9F7;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .bg-primary-dark { background-color: #09040C; }
        
        /* Header */
        header {
            background-color: rgba(9, 4, 12, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1f2937;
            flex-shrink: 0;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 4rem;
        }
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #F2E9F7;
        }
        .logo-link img { height: 2rem; width: 2rem; margin-right: 0.75rem; }
        .logo-link span { font-size: 1.25rem; font-weight: 700; }
        
        .desktop-nav { display: flex; gap: 0.25rem; }
        .nav-link {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            color: #d1d5db;
            text-decoration: none;
            transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #374151;
            color: #fff;
        }

        .desktop-socials { display: flex; align-items: center; gap: 1rem; }
        .account-btn {
            display: flex; gap: 10px; align-items: center;
            color: #9ca3af; cursor: pointer; transition: 0.2s;
        }
        .account-btn:hover { color: #fff; }
        .vl { border-left: 1px solid rgba(77, 77, 77, 0.425); height: 20px; }
        
        /* IDE Content */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        #ide-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: none;
            background: #1e1e1e;
        }

        #ide-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        #launch-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(12, 1, 19, 0.8);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(165, 165, 165, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 { margin-top: 0; color: #B153DD; }
        p { color: #d1d5db; line-height: 1.6; }

        .btn-primary {
            background-color: #B153DD;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }
        .btn-primary:hover { background-color: #7720A2; transform: scale(1.02); }
        .btn-primary:disabled { background-color: #555; cursor: not-allowed; transform: none; }

        .loader {
            display: none;
            margin-top: 20px;
            font-size: 24px;
            color: #B153DD;
        }
        
        #error-msg {
            color: #ef4444;
            margin-top: 15px;
            display: none;
        }

        #credentials {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: left;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo-link">
                    <img src="{{ url_for('static', filename='silkoslogo.svg') }}" alt="SilkOS Logo">
                    <span>Silk Project [DEV]</span>
                </a>

                <nav class="desktop-nav">
                    <a href="index.html" class="nav-link">Main</a>
                    <a href="manage.html" class="nav-link">Manage</a>
                    <a href="ide.html" class="nav-link active">IDE</a>
                    <a href="about.html" class="nav-link">About</a>
                </nav>
                
                <div class="desktop-socials">
                    <div class="account-btn" onclick="account()">
                        <i class="fa fa-user"></i>
                        <span class="account-name">Account</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="launch-screen">
            <h1>Silk Web IDE [BETA]</h1>
            <p>Launch your personal development environment powered by Code-Server.</p>
            
            <div id="credentials">
                <strong>Password:</strong> <span id="ide-password">...</span>
            </div>

            <button id="launch-btn" class="btn-primary" onclick="launchIDE()">
                <i class="fa fa-rocket"></i> Launch Environment
            </button>
            
            <div class="loader">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
            </div>
            
            <p id="error-msg"></p>
        </div>

        <div id="ide-container">
            <iframe id="ide-frame" src=""></iframe>
        </div>
    </main>

    <script>
        const token = localStorage.getItem("silk-token");
        const launchBtn = document.getElementById('launch-btn');
        const loader = document.querySelector('.loader');
        const errorMsg = document.getElementById('error-msg');
        const ideContainer = document.getElementById('ide-container');
        const launchScreen = document.getElementById('launch-screen');
        const credentialsBox = document.getElementById('credentials');
        const passwordSpan = document.getElementById('ide-password');
        let accountNameElements = document.getElementsByClassName("account-name");
        
        let ide_url = "";

        async function validate() {
            try {
                const response = await fetch("/api/validate/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token })
                });
                const data = await response.json();
                if (data.status === "Success") {
                    for(let el of accountNameElements) el.innerText = data.username;
                } else {
                    window.location.href = "login.html";
                }
            } catch (err) {
                window.location.href = "login.html";
            }
        }

        async function launchIDE() {
            launchBtn.disabled = true;
            loader.style.display = 'block';
            errorMsg.style.display = 'none';
            
            try {
                const response = await fetch("/api/ide/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token })
                });
                
                const data = await response.json();
                
                if (data.status === "Success") {
                    passwordSpan.innerText = data.password;
                    credentialsBox.style.display = 'block';
                    ide_url = data.url;
                    
                    launchBtn.innerText = "Open IDE Now";
                    launchBtn.disabled = false;
                    launchBtn.onclick = openIDE;
                    
                } else {
                    throw new Error(data.message || "Failed to start IDE");
                }
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.style.display = 'block';
                launchBtn.disabled = false;
            } finally {
                loader.style.display = 'none';
            }
        }
        
        function openIDE() {
            launchScreen.style.display = 'none';
            ideContainer.style.display = 'block';
            document.getElementById('ide-frame').src = ide_url;
        }

        function account() {
            window.location.href = "manage.html";
        }

        if(!token) window.location.href = "login.html";
        else validate();

    </script>
</body>
</html>
